[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-merge-tool"
version = "1.2.3"
description = "Merge PDF/DOCX files and shrink the result with iLovePDF - Windows GUI + CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "chmzs" }]
keywords = ["pdf", "merge", "compress", "ilovepdf", "docx"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = [
    "pypdf>=5.0",
    "ilovepdf>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyinstaller>=6.6"]

[project.scripts]
pdf-merge = "pdfmerge.cli:main"

[project.gui-scripts]
pdf-merge-gui = "pdfmerge.gui:main"

[project.urls]
Homepage = "https://github.com/chmzs/pdf-merge-tool"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdfmerge = ["assets/*.ico", "assets/*.png"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["pdfmerge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
